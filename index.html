<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --fg: #000; --muted: #888; --border: #ddd;
    --tag-bg: #e8f0fe; --tag-fg: #246; --danger: #c00; --link: #06c;
  }
  :root[data-theme=dark] {
    color-scheme: dark;
    --bg: #1b1b1f; --fg: #eee; --muted: #9a9aa3; --border: #3a3a42;
    --tag-bg: #2b3a55; --tag-fg: #cfe0ff; --danger: #ff6b6b; --link: #6cb0ff;
  }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px;
         background: var(--bg); color: var(--fg); }
  #theme { text-align: right; font-size: 14px; }
  h1 { text-align: center; }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=text], input[type=date], select { padding: 8px; font-size: 16px; }
  #controls select { padding: 2px; font-size: 14px; }
  #theme select { padding: 2px; font-size: 14px; }
  #input { flex: 1 1 100%; }
  #category { flex: 1; min-width: 0; }
  #controls { display: flex; gap: 16px; margin-top: 16px; font-size: 14px; }
  .tag { background: var(--tag-bg); color: var(--tag-fg); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .overdue { color: var(--danger); font-weight: bold; }
  button { font-size: 16px; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  li span { flex: 1; }
  li small { color: var(--muted); font-size: 12px; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li button { border: none; background: none; color: var(--danger); }
  li button.edit { color: var(--link); }

  /* phones: dates drop under the item text, buttons get bigger tap areas */
  @media (max-width: 480px) {
    li { flex-wrap: wrap; }
    li span { min-width: 0; overflow-wrap: anywhere; }
    li small { order: 5; flex-basis: 100%; padding-left: 28px; }
    li button { padding: 8px 10px; font-size: 18px; }
    li input[type=checkbox] { width: 20px; height: 20px; }
  }
</style>
</head>
<body>
  <div id="theme">
    <label>Mode <select id="themeSelect">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select></label>
  </div>
  <h1>To-Do</h1>
  <form id="form">
    <input type="text" id="input" placeholder="New item" autocomplete="off">
    <select id="category" title="Category">
      <option>Work</option>
      <option>Personal</option>
      <option>Others</option>
    </select>
    <input type="date" id="due" title="Due date (optional)">
    <button type="submit">Add</button>
  </form>
  <div id="controls">
    <label>Show <select id="filter">
      <option value="">All categories</option>
      <option>Work</option>
      <option>Personal</option>
      <option>Others</option>
    </select></label>
    <label>Sort by <select id="sort">
      <option value="added">Order added</option>
      <option value="due">Due date</option>
    </select></label>
  </div>
  <ul id="list"></ul>

<script>
  // items and theme are saved in the browser (localStorage) so they survive reloads
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  let todos = load('todos', []);
  let nextId = todos.reduce((m, t) => Math.max(m, t.id), 0) + 1;
  const list = document.getElementById('list');
  const input = document.getElementById('input');
  const category = document.getElementById('category');
  const due = document.getElementById('due');
  const CATEGORIES = ['Work', 'Personal', 'Others'];
  const themeSelect = document.getElementById('themeSelect');
  const filter = document.getElementById('filter');
  const sort = document.getElementById('sort');
  filter.addEventListener('change', () => render());
  sort.addEventListener('change', () => render());

  // light/dark mode: start from the system setting, then follow the selector
  themeSelect.value = load('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function applyTheme() { document.documentElement.dataset.theme = themeSelect.value; save('theme', themeSelect.value); }
  themeSelect.addEventListener('change', applyTheme);
  applyTheme();

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function render() {
    save('todos', todos);
    list.innerHTML = '';

    let shown = todos.filter(t => filter.value === '' || t.category === filter.value);
    if (sort.value === 'due') {
      // earliest due first; items with no due date go last
      shown = [...shown].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    }

    for (const t of shown) {
      const li = document.createElement('li');
      li.dataset.id = t.id;
      if (t.done) li.className = 'done';

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = t.done;

      const span = document.createElement('span');
      span.textContent = t.text;

      if (t.category) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t.category;
        span.append(' ', tag);
      }

      const date = document.createElement('small');
      date.textContent = 'Added ' + t.added;
      if (t.due) {
        const dueEl = document.createElement('small');
        dueEl.textContent = ' · Due ' + new Date(t.due + 'T00:00').toLocaleDateString();
        if (!t.done && t.due < today()) dueEl.className = 'overdue';
        date.append(dueEl);
      }

      const edit = document.createElement('button');
      edit.textContent = '✎';
      edit.title = 'Edit';
      edit.className = 'edit';

      const del = document.createElement('button');
      del.textContent = '🗑';
      del.title = 'Delete';

      li.append(box, span, date, edit, del);
      list.append(li);
    }
  }
  render();

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: nextId++, text, done: false, added: new Date().toLocaleDateString(),
                 category: category.value, due: due.value });
    input.value = '';
    due.value = '';
    render();
  });

  list.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.className === 'edit') {
      const t = todos.find(t => t.id === id);
      const text = prompt('Edit item:', t.text);
      if (text === null || !text.trim()) return;
      const cat = prompt('Category (Work, Personal or Others):', t.category);
      if (cat === null) return;
      const match = CATEGORIES.find(c => c.toLowerCase() === cat.trim().toLowerCase());
      if (!match) { alert('Category must be Work, Personal or Others'); return; }
      const d = prompt('Due date as YYYY-MM-DD (blank for none):', t.due);
      if (d === null) return;
      if (d.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(d.trim())) { alert('Use the format YYYY-MM-DD'); return; }
      t.text = text.trim();
      t.category = match;
      t.due = d.trim();
    } else if (e.target.tagName === 'BUTTON') {
      todos = todos.filter(t => t.id !== id);
    } else if (e.target.type === 'checkbox') {
      const t = todos.find(t => t.id === id);
      t.done = e.target.checked;
    } else return;
    render();
  });
</script>
</body>
</html>
